name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without a content change (e.g. after editing settings).
  workflow_dispatch:

# Allow the workflow to publish Pages, but only one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the local toolchain; Hugo templates are
      # version-sensitive and a silent upgrade can change output.
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # the theme is a submodule; without this the build has no layouts
          fetch-depth: 0          # full history: front matter dates are recovered from git

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify front matter is complete
        run: python3 scripts/sync_frontmatter.py --check

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
