baseURL      = "https://ostring24.github.io/"
locale       = "en-us"
title        = "OString"
theme        = "PaperMod"

# Without this Hugo counts words by splitting on whitespace. Chinese has none,
# so a 6,000-character article reported "81 words · 1 min". This makes word
# count and reading time count CJK characters instead.
hasCJKLanguage = true

enableEmoji    = true
enableRobotsTXT = true
enableGitInfo  = false
buildDrafts    = false
buildFuture    = false
buildExpired   = false

[pagination]
  pagerSize = 10

# ---------------------------------------------------------------- params
[params]
  env         = "production"   # enables SEO / OpenGraph / JSON-LD output
  author      = "OString"
  title       = "OString"
  description = "Notes on AI infrastructure, optical interconnect, semiconductors and the companies building them."
  keywords    = ["AI Infrastructure", "Data Center", "CPO", "Silicon Photonics", "LLM", "Semiconductors"]
  DateFormat  = "2006-01-02"

  # Only content under content/posts/ feeds the homepage stream.
  mainSections = ["posts"]

  defaultTheme       = "auto"
  ShowReadingTime    = true
  ShowWordCount      = true
  ShowToc            = true
  TocOpen            = false
  ShowBreadCrumbs    = true
  ShowPostNavLinks   = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS  = false
  hideFooter         = false
  disableScrollToTop = false
  # Long-form technical writing: show the summary, not the whole article.
  # (The old site inlined every post on the homepage.)
  ShowPageNums       = true

  [params.homeInfoParams]
    Title   = "OString"
    Content = """
Notes on AI infrastructure and the hardware underneath it — optical interconnect, CPO,
data-center design, model internals, and the companies whose numbers depend on all of it.

Mostly written in Chinese. Start with [Infrastructure](/posts/infra/) or browse the
[archive](/archives/).
"""

  [params.assets]
    disableFingerprinting = false
    favicon               = "/favicon.ico"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

  # Site search (Fuse.js) — tuned for CJK, where the default
  # token separator never matches.
  [params.fuseOpts]
    isCaseSensitive   = false
    shouldSort        = true
    location          = 0
    distance          = 1000
    threshold         = 0.4
    minMatchCharLength = 1
    ignoreLocation    = true
    keys              = ["title", "permalink", "summary", "content"]

# ---------------------------------------------------------------- menu
[menu]
  [[menu.main]]
    identifier = "infra"
    name       = "Infrastructure"
    url        = "/posts/infra/"
    weight     = 10
  [[menu.main]]
    identifier = "tech"
    name       = "Tech Watch"
    url        = "/posts/tech/"
    weight     = 20
  [[menu.main]]
    identifier = "research"
    name       = "Research"
    url        = "/posts/research/"
    weight     = 30
  [[menu.main]]
    identifier = "solutions"
    name       = "Solutions"
    url        = "/posts/solutions/"
    weight     = 40
  [[menu.main]]
    identifier = "archives"
    name       = "Archive"
    url        = "/archives/"
    weight     = 50
  [[menu.main]]
    identifier = "tags"
    name       = "Tags"
    url        = "/tags/"
    weight     = 60
  [[menu.main]]
    identifier = "search"
    name       = "Search"
    url        = "/search/"
    weight     = 70
  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 80

# ---------------------------------------------------------------- output
# JSON on the home page is the search index Fuse.js reads.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Only tags. A "categories" taxonomy would map 1:1 onto the four sections,
# duplicating them — and a category term sharing a section's name makes
# site.GetPage ambiguous, which breaks the theme's menu rendering.
[taxonomies]
  tag = "tags"

# ---------------------------------------------------------------- markup
[markup]
  [markup.goldmark.renderer]
    unsafe = true          # posts contain inline HTML
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]
  [markup.highlight]
    noClasses      = false   # use PaperMod's theme-aware Chroma stylesheet
    codeFences     = true
    guessSyntax    = true
    lineNos        = false
    tabWidth       = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[minify]
  disableXML = true
